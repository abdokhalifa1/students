<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تم إيقاف الموقع</title>
<style>
  :root {
    --bg: #0d0b16;
    --card: #2b2140;
    --card2: #3a2d58;
    --text: #ffffff;
    --subtext: #c9c0dd;
    --accent: #8a63ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: radial-gradient(circle at 50% 0%, #241a38 0%, var(--bg) 60%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }
  .logo {
    border: 1.5px solid #5a4d7a;
    border-radius: 999px;
    padding: 10px 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 36px;
    background: #000;
  }
  .logo span {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    font-size: 1.2rem;
    text-transform: lowercase;
  }
  .logo .flame { font-size: 1.1rem; }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 36px 26px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: var(--card2);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg {
    width: 28px;
    height: 28px;
    stroke: var(--accent);
  }
  h1 {
    color: var(--text);
    font-size: 1.25rem;
    margin: 0 0 8px;
  }
  p {
    color: var(--subtext);
    font-size: 0.95rem;
    line-height: 1.7;
    margin: 0 0 26px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 13px 26px;
    border-radius: 14px;
  }
  .btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
  }
</style>
</head>
<body>
  <div class="logo">
    <span>ahmed khalifa</span>
    <span class="flame">🔥</span>
  </div>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <h1>تم إيقاف الموقع</h1>
    <p>برجاء تحميل التطبيق للمتابعة</p>
    <a class="btn" href="https://ahmedelhamal.github.io/D/">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      تحميل التطبيق
    </a>
  </div>
</body>
</html>
