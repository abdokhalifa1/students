.gx{margin:-4px 0 14px;perspective:600px}
.gx.in>*{animation:sipop .85s cubic-bezier(.2,1.3,.4,1) both}.gx.in>*:nth-child(2){animation-delay:.1s}.gx.in>*:nth-child(3){animation-delay:.2s}
.gx.out>*{animation:sipout .38s ease-in both;animation-delay:0s!important}
.gx .hint{text-align:center;font-size:13px;color:var(--mu);margin:0 0 4px}
.gstart{display:block;width:100%;margin:6px 0;padding:14px 0;border:0;background:none;color:var(--pr);font:inherit;font-size:44px;font-weight:700;text-align:center;-webkit-tap-highlight-color:transparent}
.gstart:active{transform:scale(.94)}
.gt{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px;direction:ltr}
.gt b{font-size:22px}
.gbar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin:8px 0;direction:ltr}.gbar i{display:block;height:100%;width:100%;background:var(--pr);transition:width .1s linear}
.gq{font-size:46px;font-weight:700;text-align:center;margin:14px 0;color:var(--pr);direction:ltr;white-space:nowrap}
.go{display:flex;gap:8px;direction:ltr}.go .btn{min-height:70px;font-size:28px;flex:1 1 0}
#gm_p.bad .gt{color:var(--no)}#gm_p.good .gt{color:var(--gn)}
.gres{text-align:center;margin:4px 0 6px}.gres b{display:block;font-size:34px;color:var(--pr)}
.gbr{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--soft);margin-top:6px;font-size:15px}
.gbr.me{outline:2px solid var(--pr)}.gbr b{flex:1}.gbr .rk{font-weight:700;min-width:26px;text-align:center}.gbr small{color:var(--mu);direction:ltr}
.gq.tx{font-size:21px;direction:rtl;white-space:normal;line-height:1.7;margin:12px 4px}.gq.tx bdi{font-weight:700}
.fz{display:inline-flex;align-items:center;vertical-align:middle;direction:ltr;margin:0 .12em;white-space:nowrap}.fzs{margin-inline-end:.1em}.frs{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;font-weight:700}.frs>span{padding:0 .22em}.frs>span:first-child{border-bottom:.09em solid currentColor}
.go.sm{flex-direction:column}.go.sm .btn{font-size:20px;min-height:54px}

/* حركة جيلي لأزرار تفاصيل الطالب وتعديل - زي حركة الشعار */
.sbtn{transition:transform .38s cubic-bezier(.34,1.8,.64,1),background-color .2s,color .2s;-webkit-tap-highlight-color:transparent;user-select:none}
.sbtn:active{transform:scale(1.06,.86)}
.sbtn.jl{animation:jelly .6s}
.gq:not(.tx) bdi{unicode-bidi:isolate;direction:ltr}
</style>

function loose(x){return nrm(x).toLowerCase().replace(/ـ/g,'').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[ذظ]/g,'ز').replace(/[ثص]/g,'س').replace(/ض/g,'د').replace(/ط/g,'ت').replace(/ء/g,'').replace(/\s+/g,' ')}
function lev(a,b){var m=a.length,n=b.length,p=[],i,j;for(j=0;j<=n;j++)p[j]=j;for(i=1;i<=m;i++){var c=[i];for(j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[n]}
function subseq(t,w){var i=0;for(var j=0;j<w.length&&i<t.length;j++)if(w[j]==t[i])i++;return i==t.length}
function tokScore(t,ws){var best=1e9;ws.forEach(function(w){var sc=1e9,k=t.length<=4?1:2,ix=w.indexOf(t);
 if(ix==0)sc=0;else if(ix>0)sc=1;
 else if(t.length>=2&&(lev(t,w.slice(0,t.length))<=k||lev(t,w)<=k))sc=2;
 else if(t.length>=3&&subseq(t,w))sc=3;
 if(sc<best)best=sc});return best}
function qScore(s){var qt=loose(q).replace(/(^| )ال/g,'$1').split(' ').filter(Boolean);if(!qt.length)return 0;
 var ws=loose(s.name).replace(/(^| )ال/g,'$1').split(' ').filter(Boolean),tot=0;
 for(var i=0;i<qt.length;i++){var c=tokScore(qt[i],ws);if(c>=1e9)return 1e9;tot+=c}return tot}
function flt(){return S.students.filter(function(s){return(!sg||s.grade==sg)&&(!sgr||s.group==sgr)&&(!ss||s.sex==ss)&&(!q||qScore(s)<1e9)})}
function sp(s){return s&&+s.price>0?+s.price:S.price}
var RXon=false,RX=null;function rxi(){if(!RX){RX={};for(var k in S.rec){var i=k.indexOf("|"),id=k.slice(i+1);(RX[id]||(RX[id]=[])).push([k.slice(0,i),S.rec[k]])}}return RX}
function st(s,mon){var a=0,b=0,p=0,u=0;var E;if(RXon){E=rxi()[s.id]||[]}else{E=[];for(var k in S.rec){var x=k.split("|");if(x[1]==s.id)E.push([x[0],S.rec[k]])}}for(var j=0;j<E.length;j++){if(mon&&E[j][0].slice(0,7)!=mon)continue;var r=E[j][1];if(r.a===1){a++;if(r.p===1)p++;else if(r.p===0)u++}else if(r.a===0)b++}return{a:a,b:b,p:p,u:u,o:u*sp(s)}}

function curCnt(id,k,mon){var x=st({id:id},mon||undefined);return k=="a"?x.a:k=="b"?x.b:x.u}
function setCnt(id,k,target,mon){
  mon=mon||fdate.slice(0,7);
  var cur=curCnt(id,k,mon);
  while(cur<target){
    var d=ld(new Date());if(d.slice(0,7)!=mon)d=mon+"-01";
    var cand=[];for(var i=1;i<=31;i++)cand.push(mon+"-"+("0"+i).slice(-2));
    cand.sort(function(x,y){return Math.abs(Date.parse(x)-Date.parse(d))-Math.abs(Date.parse(y)-Date.parse(d))});
    var done=false;
    for(var j=0;j<cand.length&&!done;j++){
      var key=cand[j]+"|"+id,r=S.rec[key];
      if(k=="a"&&(!r||r.a===undefined)){S.rec[key]={a:1,p:r&&r.p};done=true}
      else if(k=="b"&&(!r||r.a===undefined)){S.rec[key]={a:0};done=true}
      else if(k=="u"){if(!r||r.a===undefined){S.rec[key]={a:1,p:0};done=true}else if(r.a===1&&r.p!==0){r.p=0;done=true}}
    }
    if(!done)break;cur++;
  }
  while(cur>target){
    var L=Object.keys(S.rec).filter(function(key){var x=key.split("|"),r=S.rec[key];return x[1]==id&&x[0].slice(0,7)==mon&&(k=="a"?r.a===1:k=="b"?r.a===0:(r.a===1&&r.p===0))}).sort();
    var kk=L[L.length-1];if(!kk)break;
    if(k=="u")S.rec[kk].p=1;else delete S.rec[kk];
    cur--;
  }
  save();
}
function rlMax(id,k,mon){return Math.max(40,curCnt(id,k,mon)+20)}
function rlInit(){
  var el=document.getElementById("rl");if(!el)return;
  var id=+el.dataset.id,k=el.dataset.k,mon=el.dataset.m,W=56,cur=curCnt(id,k,mon);
  var tr=el.querySelector(".rlt");
  function sel(){var i=Math.round(el.scrollLeft/W);return Math.max(0,Math.min(i,tr.children.length-1))}
  function mark(){var i=sel();for(var c=0;c<tr.children.length;c++)tr.children[c].className=c==i?"on":""}
  el.scrollLeft=cur*W;mark();
  el.addEventListener("scroll",mark,{passive:true});
}

h+='<div class="rlw"><div class="rlm"></div><div id="rl" class="rl" data-id="'+s.id+'" data-k="'+adj.k+'" data-m="'+mm+'"><div class="rlt">'+items+'</div></div><button class="btn pr" onclick="rlOk()">✓</button></div>'}

 if(!op)return h;
 h+='<div class="gx'+(an?' '+an:'')+'">';
 if(GM.res&&GM.res.c==c)h+='<div class="gres"><span class="mu">'+L2("وقتك في "+N+" سؤال","Your time for "+N+" questions")+'</span><b>'+gmSec(GM.res.ms)+'</b><span class="mu">'+(GM.res.w?L2("غلطات: ","Mistakes: ")+GM.res.w+L2(" (+"+C.pen/1000+"ث لكل غلطة)"," (+"+C.pen/1000+"s each)"):L2("من غير ولا غلطة 👏","No mistakes 👏"))+'</span></div>';
 else h+='<div class="hint">'+L2("حلّ "+N+" سؤال صح في أقل وقت. كل غلطة بتزوّد "+C.pen/1000+" ثانية، وبيتسجّل لك أسرع وقت من محاولاتك.","Solve "+N+" questions correctly as fast as you can. Each mistake adds "+C.pen/1000+"s. Your fastest attempt counts.")+'</div>';
 var lf=ST.bd&&ST.bd[c]?ST.bd[c].left:null;
 h+=lf===0?'<div class="hint" style="margin:12px 0;font-size:15px">'+L2("خلّصت محاولاتك النهاردة. ارجع بكرة وكمّل مذاكرتك.","You've used today's attempts. Come back tomorrow.")+'</div>':'<button class="gstart" onclick="gmStart(\''+c+'\')">'+L2("بدء","Start")+'</button>'+(lf!=null?'<div class="hint">'+L2("المحاولات المتبقية النهاردة: ","Attempts left today: ")+lf+'</div>':'');
 return h+gmBoard(c)+'</div>'}
function gameCard(){return gmBar("t")+gmBar("k")}

/* ===== لوحة المتصدرين: المدرس + الطالب ===== */
var TL={open:"",anim:"",tc:"",busy:0,g:"",bd:{}};
function lbRowH(r,rk,me,nm,gr){return '<div class="gbr'+(me?' me':'')+'"><span class="rk">'+(rk<4?["🥇","🥈","🥉"][rk-1]:rk)+'</span><b>'+esc(nm)+(me?' ('+L2("أنت","you")+')':'')+(gr?' <small style="direction:rtl">'+esc(gn(gr))+'</small>':'')+'</b>'+(r.w?'<small>✕'+r.w+'</small>':'')+'<span>'+gmSec(r.ms)+'</span></div>'}
function tlBoardH(c){var R=TL.bd[c];if(!R)return '<div class="mu" style="text-align:center">…</div>';
 var F=R.filter(function(r){return !TL.g||r.grade==TL.g});
 if(!F.length)return '<div class="mu" style="text-align:center">'+L2("لسه محدش خلّص التحدّي.","No one has finished yet.")+'</div>';
 return F.slice(0,50).map(function(r,i){return lbRowH(r,i+1,false,r.name,TL.g?"":r.grade)}).join("")}
function tlFill(c){var e=document.getElementById("tl_b");if(e&&TL.open==c)e.innerHTML=tlBoardH(c)}
function tlLoad(c){TL.bd[c]=null;if(!window.FB||!FB.teacherBoard)return;FB.teacherBoard(c).then(function(r){TL.bd[c]=r;tlFill(c)}).catch(function(e){console.error(e);TL.bd[c]=[];tlFill(c)})}
function tlTog(c){if(TL.busy)return;TL.tc=c;
 if(TL.open!=c){TL.open=c;TL.anim="in";tlLoad(c);draw();setTimeout(function(){TL.anim=""},1000)}
 else{TL.anim="out";TL.busy=1;draw();setTimeout(function(){TL.open="";TL.anim="";TL.busy=0;draw()},400)}}
function tlGrade(v){TL.g=v;if(TL.open)tlFill(TL.open)}
function tlBar(c){var C=CT[c],an=TL.anim,op=TL.open==c,
 h='<div class="gb2'+(an&&TL.tc==c?' jl':'')+'" onclick="tlTog(\''+c+'\')"><span class="gsym">'+C.sy+'</span><b>'+L2(C.nm[0],C.nm[1])+'</b><span class="gchev'+(op&&an!="out"?' up':'')+'">⌄</span></div>';
 if(!op)return h;
 return h+'<div class="gx'+(an?' '+an:'')+'"><div class="card"><div class="row"><select onchange="tlGrade(this.value)"><option value="">'+t("allgr")+'</option>'+GR.map(function(g){return '<option value="'+g+'"'+(g==TL.g?' selected':'')+'>'+gn(g)+'</option>'}).join("")+'</select></div><div id="tl_b">'+tlBoardH(c)+'</div></div></div>'}
function tlView(){return tlBar("t")+tlBar("k")}
function lbLoad(c){if(!ST.data||!window.FB||!FB.getBoard)return;FB.getBoard(ST.data.phone,ST.pc,c).then(function(r){ST.lb=ST.lb||{};ST.lb[c]=r;if(ST.tab=="lb"&&ST.lbc==c){var e=document.getElementById("stlb");if(e)e.innerHTML=lbHtml(c)}}).catch(function(e){console.error(e)})}
function lbHtml(c){var B=ST.lb&&ST.lb[c];if(!B)return '<div class="mu" style="text-align:center">…</div>';
 var R=B.rows,h='<span class="lbl" style="text-align:center">'+L2("المتصدرين في صفك: ","Leaders in your grade: ")+esc(gn(ST.data.grade))+'</span>';
 if(!R.length)return h+'<div class="mu" style="text-align:center">'+L2("لسه محدش خلّص التحدّي. كن أول واحد!","No one has finished yet. Be the first!")+'</div>';
 R.slice(0,10).forEach(function(r){h+=lbRowH(r,r.rank,r.sid==B.sid,r.name,"")});
 var me=R.filter(function(r){return r.sid==B.sid})[0];if(me&&me.rank>10)h+='<div class="mu" style="text-align:center">⋮</div>'+lbRowH(me,me.rank,true,me.name,"");
 return h}
function lbPick(c){ST.lbc=c;ST.lb=ST.lb||{};ST.lb[c]=null;lbLoad(c);draw()}
function lbView(){var c=ST.lbc||"t";
 return '<div class="tabs2">'+["t","k"].map(function(k){return '<button class="btn '+(c==k?"pr":"")+'" onclick="lbPick(\''+k+'\')">'+L2(CT[k].nm[0],CT[k].nm[1])+'</button>'}).join("")+'</div><div class="card" id="stlb">'+lbHtml(c)+'</div>'}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signInAnonymously,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,doc,getDoc,setDoc,updateDoc,deleteDoc,increment,collection,getDocs,onSnapshot,query,where,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCar3idR0O-_ZeRGa66GWVAQd7YfJs9YU8",
  authDomain:"ak11-bf6eb.firebaseapp.com",
  projectId:"ak11-bf6eb",
  storageBucket:"ak11-bf6eb.firebasestorage.app",
  messagingSenderId:"749008446014",
  appId:"1:749008446014:web:183b5877874e9f0cd4a76f"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
let db;
try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}

function today(){return ld(new Date())}
function pidOf(ph,code){return pn(ph)+"_"+String(code)}

let lastMain="",lastM={},lastHw={},lastPortal={},timer=null;
let unsubMsgs=null,unsubReps=null,unsubSubs=null;
window.SOLV={};
window.TMSGS=[];window.TREPS=[];window.TSUBS=[];

function stopListeners(){
  if(unsubMsgs){unsubMsgs();unsubMsgs=null}
  if(unsubReps){unsubReps();unsubReps=null}
  if(unsubSubs){unsubSubs();unsubSubs=null}
  TMSGS=[];TREPS=[];TSUBS=[];
}
function startListeners(uid){
  stopListeners();
  unsubMsgs=onSnapshot(query(collection(db,"messages"),where("uid","==",uid)),snap=>{
    const L=[];snap.forEach(d=>L.push(d.data()));TMSGS=L;draw();
  },e=>console.error(e));
  unsubReps=onSnapshot(query(collection(db,"reports"),where("uid","==",uid)),snap=>{
    const L=[];snap.forEach(d=>L.push(d.data()));TREPS=L;draw();
  },e=>console.error(e));
  unsubSubs=onSnapshot(collection(db,"teachers",uid,"subs"),snap=>{
    const L=[];snap.forEach(d=>L.push(d.data()));TSUBS=L;draw();
  },e=>console.error(e));
}

window.FB={
  login:(e,p)=>signInWithEmailAndPassword(auth,e,p),
  logout:()=>signOut(auth),

  // ---- student side ----
  async studentLogin(phone,code){
    if(!auth.currentUser)await signInAnonymously(auth);
    const pid=pidOf(phone,code);const ref=doc(db,"portal",pid);
    let snap;
    try{snap=await getDoc(ref)}catch(e){if(e.code=="permission-denied")return null;throw e}
    if(!snap.exists())return null;
    const d=snap.data();

    const hs=await getDocs(query(collection(db,"portal",pid,"hw")));
    const hw=[];hs.forEach(x=>hw.push(x.data()));
    hw.sort((a,b)=>String(b.id).localeCompare(String(a.id)));
    const sol={};
    const ss=await getDocs(collection(db,"portal",pid,"sol"));
    ss.forEach(x=>{sol[x.id]=x.data()});
    let notes=[];
    try{const ns=await getDocs(query(collection(db,"notices"),where("uid","==",d.uid),where("grade","==",d.grade)));ns.forEach(x=>notes.push(x.data()))}catch(e){console.error(e)}
    let msgs=[];
    try{const ms=await getDocs(query(collection(db,"messages"),where("uid","==",d.uid),where("sid","==",d.sid)));ms.forEach(x=>msgs.push(x.data()))}catch(e){console.error(e)}
    let reps=[];
    try{const rs=await getDocs(query(collection(db,"reports"),where("uid","==",d.uid),where("sid","==",d.sid)));rs.forEach(x=>reps.push(x.data()))}catch(e){console.error(e)}

    return {data:d,hw,sol,notes,msgs,reps};
  },
  async studentLogout(){try{await signOut(auth)}catch(e){}},

  async submitSol(phone,code,hwId,imgs){
    const pid=pidOf(phone,code);
    const pref=doc(db,"portal",pid);
    const psnap=await getDoc(pref);
    if(!psnap.exists())throw {code:"permission-denied"};
    const p=psnap.data();
    const subRef=doc(db,"teachers",p.uid,"subs",p.sid+"_"+hwId);
    if(!imgs||!imgs.length){
      await deleteDoc(doc(db,"portal",pid,"sol",hwId));
      try{await deleteDoc(subRef)}catch(e){}
      return;
    }
    await setDoc(doc(db,"portal",pid,"sol",hwId),{imgs,at:Date.now()});
    await setDoc(subRef,{sid:p.sid,hwId:hwId,grade:p.grade,at:Date.now()});
  },

  async sendRep(phone,code,v){
    const pid=pidOf(phone,code);
    const psnap=await getDoc(doc(db,"portal",pid));
    if(!psnap.exists())throw {code:"permission-denied"};
    const p=psnap.data();
    const day=today();
    const r={id:p.uid+"_"+p.sid+"_"+day,sid:p.sid,grade:p.grade,day,v:+v,uid:p.uid,at:Date.now()};
    await setDoc(doc(db,"reports",r.id),r);
    return r;
  },

  async sendMsg(phone,code,ref,text){
    const pid=pidOf(phone,code);
    const psnap=await getDoc(doc(db,"portal",pid));
    if(!psnap.exists())throw {code:"permission-denied"};
    const p=psnap.data();
    const m={id:String(Date.now())+"_"+Math.floor(Math.random()*1000),uid:p.uid,sid:p.sid,grade:p.grade,ref:ref||"",text:String(text||"").slice(0,600),at:Date.now()};
    await setDoc(doc(db,"messages",m.id),m);
    return m;
  },

  async startPlay(phone,code,c){
    const pid=pidOf(phone,code);
    const psnap=await getDoc(doc(db,"portal",pid));
    if(!psnap.exists())throw {code:"permission-denied"};
    const p=psnap.data();
    const day=today(),pk=p.uid+"_"+p.sid+"_"+day+"_"+c;
    const pref=doc(db,"plays",pk);
    const snap=await getDoc(pref);
    if(!snap.exists()){
      await setDoc(pref,{uid:p.uid,sid:p.sid,day,c,count:1});
      return {left:2};
    }
    const cur=snap.data().count||0;
    if(cur>=3)throw {code:"limit"};
    await updateDoc(pref,{count:increment(1)});
    return {left:2-cur};
  },

  async sendScore(phone,code,c,ms,w){
    const pid=pidOf(phone,code);
    const psnap=await getDoc(doc(db,"portal",pid));
    if(!psnap.exists())throw {code:"permission-denied"};
    const p=psnap.data();
    ms=Math.floor(+ms)||0;w=Math.floor(+w)||0;
    const gref=doc(db,"games",p.uid+"_"+c+"_"+p.sid);
    const gsnap=await getDoc(gref);
    if(!gsnap.exists()||ms<gsnap.data().ms){
      await setDoc(gref,{uid:p.uid,c,sid:p.sid,grade:p.grade,name:p.name,ms,w,at:Date.now()});
    }
  },

  async getBoard(phone,code,c){
    const pid=pidOf(phone,code);
    const psnap=await getDoc(doc(db,"portal",pid));
    if(!psnap.exists())throw {code:"permission-denied"};
    const p=psnap.data();
    const day=today();
    let left=3;
    try{const pl=await getDoc(doc(db,"plays",p.uid+"_"+p.sid+"_"+day+"_"+c));if(pl.exists())left=Math.max(0,3-(pl.data().count||0))}catch(e){}
    let rows=[];
    try{
      const qs=await getDocs(query(collection(db,"games"),where("uid","==",p.uid),where("c","==",c),where("grade","==",p.grade),orderBy("ms"),limit(50)));
      let i=0;qs.forEach(d=>{i++;const g=d.data();rows.push({sid:g.sid,name:String(g.name||"").split(" ")[0],ms:g.ms,w:g.w||0,rank:i})});
    }catch(e){console.error(e)}
    return {sid:p.sid,left,rows};
  },

  async teacherBoard(c){
    const u=auth.currentUser;if(!u||u.isAnonymous)throw {code:"auth"};
    const qs=await getDocs(query(collection(db,"games"),where("uid","==",u.uid),where("c","==",c)));
    const rows=[];
    qs.forEach(d=>{const g=d.data();rows.push({sid:g.sid,name:String(g.name||""),grade:g.grade,ms:g.ms||0,w:g.w||0})});
    rows.sort((a,b)=>a.ms-b.ms);
    return rows;
  }
};

// ---- teacher: load ----
async function loadFor(u){
  const main=await getDoc(doc(db,"teachers",u.uid));
  const snap=await getDocs(collection(db,"teachers",u.uid,"months"));
  const hs=await getDocs(collection(db,"teachers",u.uid,"hw"));
  const o={students:[],rec:{},price:50,lang:S.lang||"ar",hw:[]};
  lastMain="";lastM={};lastHw={};lastPortal={};
  if(main.exists()){const d=main.data();o.students=d.students||[];if(d.price!=null)o.price=d.price;if(d.lang)o.lang=d.lang;
    o.students.forEach(s=>{if(!s.code)s.code=String(1000+Math.floor(Math.random()*9000))});
    lastMain=JSON.stringify({students:o.students,price:o.price,lang:o.lang})}
  snap.forEach(m=>{const r=(m.data().rec)||{};Object.assign(o.rec,r);lastM[m.id]=JSON.stringify(r)});
  hs.forEach(h=>{const d=h.data();o.hw.push(d);lastHw[d.id]=1});
  o.notices=[];try{const ns=await getDocs(query(collection(db,"notices"),where("uid","==",u.uid)));ns.forEach(x=>o.notices.push(x.data()))}catch(e){console.error(e)}
  setData(o);
}

onAuthStateChanged(auth,async u=>{
  AU.err="";
  if(u&&!u.isAnonymous){
    AU.ready=false;AU.user=null;draw();
    try{await loadFor(u);AU.user=u;AU.sync="";ST.data=null;
      lastMain="";cloudSave();
      startListeners(u.uid);
    }
    catch(e){AU.err=errMsg(e);AU.user=null;signOut(auth).catch(()=>{})}
  }else if(u&&u.isAnonymous){
    AU.user=null;stopListeners();
  }else{
    AU.user=null;AU.sync="";stopListeners();
    if(!ST.data)setData({students:[],rec:{},price:50,lang:S.lang,hw:[]});
  }
  AU.busy=false;AU.ready=true;draw();
});

window.cloudSave=function(){
  if(!auth.currentUser||auth.currentUser.isAnonymous)return;
  clearTimeout(timer);AU.sync="saving";syncUI();
  timer=setTimeout(flush,500);
};

window.cloudDelHw=async function(id){
  const u=auth.currentUser;if(!u||u.isAnonymous)return;
  try{
    await deleteDoc(doc(db,"teachers",u.uid,"hw",id));delete lastHw[id];
    for(const k of Object.keys(lastPortal)){if(k.indexOf("|")<0){try{await deleteDoc(doc(db,"portal",k,"hw",id))}catch(e){}}}
    const toDel=TSUBS.filter(x=>x.hwId==id);
    for(const x of toDel){try{await deleteDoc(doc(db,"teachers",u.uid,"subs",x.sid+"_"+id))}catch(e){}}
  }catch(e){console.error(e)}
};

window.cloudSendNt=async function(n){
  const u=auth.currentUser;if(!u||u.isAnonymous)return;
  try{await setDoc(doc(db,"notices",n.id),{...n,uid:u.uid})}
  catch(e){console.error(e);S.notices=(S.notices||[]).filter(x=>x.id!=n.id);draw()}
};
window.cloudDelNt=async function(id){
  const u=auth.currentUser;if(!u||u.isAnonymous)return;
  try{await deleteDoc(doc(db,"notices",id))}catch(e){console.error(e)}
};
window.cloudDelMsg=async function(id){
  const u=auth.currentUser;if(!u||u.isAnonymous)return;
  try{await deleteDoc(doc(db,"messages",id))}catch(e){console.error(e)}
};

window.cloudSubs=function(){
  const out=[];
  (S.hw||[]).forEach(w=>{
    const names=[];
    TSUBS.forEach(x=>{
      if(x.hwId!=w.id)return;
      const s=S.students.find(ss=>ss.id==x.sid&&ss.grade==w.grade);
      if(s)names.push(s.name);
    });
    out.push({w,names});
  });
  return out;
};
window.cloudSubCount=function(since){
  let c=0;TSUBS.forEach(x=>{if(x.at>since&&S.students.some(s=>s.id==x.sid))c++});
  return c;
};
window.cloudSubMax=function(){
  let m=0;TSUBS.forEach(x=>{if((x.at||0)>m)m=x.at||0});
  return m;
};
window.cloudMsgs=function(){return TMSGS.slice()};
window.cloudMsgCount=function(since){
  return TMSGS.filter(m=>m.at>since&&S.students.some(s=>s.id==m.sid)).length;
};
window.cloudMsgMax=function(){
  let m=0;TMSGS.forEach(x=>{if(x.at>m)m=x.at});
  return m;
};
window.cloudReps=function(){return TREPS.slice()};

window.cloudLoadSolv=async function(hwId){
  const u=auth.currentUser;if(!u||u.isAnonymous)return;
  const w=(S.hw||[]).find(x=>x.id==hwId);if(!w)return;
  const out={};
  try{
    for(const s of S.students.filter(x=>x.grade==w.grade)){
      const ph=pn(s.phone);if(!ph)continue;
      const d=await getDoc(doc(db,"portal",ph+"_"+String(s.code||""),"sol",hwId));
      if(d.exists()){const v=d.data();if((v.imgs&&v.imgs.length)||v.img)out[s.id]=v}
    }
  }catch(e){console.error(e)}
  SOLV[hwId]=out;draw();
};

function stat(s){const x=st(s);return {a:x.a,b:x.b,p:x.p,u:x.u}}

async function flush(){
  const u=auth.currentUser;if(!u||u.isAnonymous)return;
  const data=JSON.parse(JSON.stringify(S));
  const main={students:data.students,price:data.price,lang:data.lang};
  const mj=JSON.stringify(main),ps=[];
  try{
    if(mj!==lastMain){lastMain=mj;ps.push(setDoc(doc(db,"teachers",u.uid),main))}
    const by={};
    for(const k in data.rec){const m=k.slice(0,7);(by[m]=by[m]||{})[k]=data.rec[k]}
    for(const m in by){const j=JSON.stringify(by[m]);if(lastM[m]!==j){lastM[m]=j;ps.push(setDoc(doc(db,"teachers",u.uid,"months",m),{rec:by[m]}))}}
    for(const m of Object.keys(lastM)){if(!by[m]){delete lastM[m];ps.push(deleteDoc(doc(db,"teachers",u.uid,"months",m)))}}
    // homework (teacher copy)
    for(const w of (data.hw||[])){if(!lastHw[w.id]){lastHw[w.id]=1;ps.push(setDoc(doc(db,"teachers",u.uid,"hw",w.id),w))}}
    // student portal copies (own phone + parent phone, both keyed by the same code)
    const live={};
    for(const s of data.students){
      const ownPh=pn(s.phone);
      const pids=[];
      if(ownPh)pids.push(ownPh);
      const parPh=pn(s.parentPhone);
      if(parPh&&parPh!==ownPh)pids.push(parPh);
      for(const ph of pids){
        const pid=ph+"_"+String(s.code||"");live[pid]=1;
        const pj={uid:u.uid,sid:s.id,name:s.name,grade:s.grade,phone:ownPh,parentPhone:parPh||"",...stat(s)};
        const j=JSON.stringify(pj);
        if(lastPortal[pid]!==j){lastPortal[pid]=j;ps.push(setDoc(doc(db,"portal",pid),pj))}
        for(const w of (data.hw||[])){
          if(w.grade!==s.grade)continue;
          const key=pid+"|"+w.id;
          if(!lastPortal[key]){lastPortal[key]=1;ps.push(setDoc(doc(db,"portal",pid,"hw",w.id),{...w,uid:u.uid}))}
        }
      }
    }
    for(const k of Object.keys(lastPortal)){
      if(k.indexOf("|")<0&&!live[k]){delete lastPortal[k];ps.push(deleteDoc(doc(db,"portal",k)))}
    }
    await Promise.all(ps);
    AU.sync="ok";
  }catch(e){
    lastMain="";lastM={};lastHw={};lastPortal={};AU.sync="err";console.error(e);
  }
  syncUI();
}
</script>
<script>
(function(){var P=null,F=0,G=0,NK=null;
document.addEventListener("click",function(e){var T=e.target,el=T.closest&&T.closest("nav button,.gear,.gate .btn,.tabs2 .btn,button[onclick*=goBack]");if(el){G=el.classList.contains("gear");F=1;var nb=T.closest("nav button");NK=nb?nb.getAttribute("data-k"):null}},true);
var od=window.draw;
window.draw=function(){od.apply(this,arguments);if(NK){var ni=document.querySelector('nav button[data-k="'+NK+'"] i');NK=null;if(ni)ni.classList.add("ani")}if(!F)return;F=0;
if(G){G=0;var g=document.querySelector(".gear");if(g){g.classList.remove("spin");void g.offsetWidth;g.classList.add("spin")}}
var a=document.getElementById("app");if(a&&a.animate){[].slice.call(a.querySelectorAll(".card"),0,8).forEach(function(c,i){c.animate([{opacity:0,transform:"translateY(16px)"},{opacity:1,transform:"none"}],{duration:320,delay:Math.min(i,6)*45,easing:"cubic-bezier(.2,.8,.2,1)",fill:"backwards"})})}};

<script>
(function(){
var nav=document.getElementById("nav");if(!nav)return;
var down=false,moved=false,sx=0,lx=0,tm=null,hit=null;
function B(){return [].slice.call(nav.querySelectorAll("button"))}
function near(x){var best=null,bd=1e9;B().forEach(function(e){var r=e.getBoundingClientRect(),d=Math.abs(x-(r.left+r.width/2));if(d<bd){bd=d;best=e}});return best}
function mag(x){var n=near(x);B().forEach(function(e){var r=e.getBoundingClientRect(),d=Math.abs(x-(r.left+r.width/2)),k=Math.max(0,1-d/110),i=e.querySelector("i");if(i)i.style.transform=k?"translateY("+(-8*k)+"px) scale("+(1+.45*k)+")":"";e.classList.toggle("hv",e===n)})}
function clr(){B().forEach(function(e){var i=e.querySelector("i");if(i)i.style.transform="";e.classList.remove("hv")})}
function commit(){if(!down||!moved)return;var n=near(lx);if(n&&!n.classList.contains("on")){try{navigator.vibrate&&navigator.vibrate(8)}catch(x){}n.click()}}
nav.addEventListener("pointerdown",function(e){if(e.button>0)return;down=true;moved=false;sx=lx=e.clientX;try{nav.setPointerCapture(e.pointerId)}catch(x){}hit=near(e.clientX)});
nav.addEventListener("pointermove",function(e){if(!down)return;lx=e.clientX;if(!moved&&Math.abs(lx-sx)>8)moved=true;if(!moved)return;mag(lx);clearTimeout(tm);tm=setTimeout(commit,240)});
function end(e,cancel){if(!down)return;down=false;clearTimeout(tm);if(cancel){clr();return}
if(moved){var n=near(e.clientX);clr();if(n&&!n.classList.contains("on"))n.click();return}
var n2=hit||near(e.clientX);if(!n2)return;var i=n2.querySelector("i");if(i){i.style.transform="scale(1.45)";setTimeout(function(){i.style.transform="scale(.88)"},120)}
setTimeout(function(){if(i)i.style.transform="";n2.click()},220)}
nav.addEventListener("pointerup",function(e){end(e,false)});
nav.addEventListener("pointercancel",function(e){end(e,true)});
window.addEventListener("click",function(e){if(e.isTrusted&&e.detail>0&&nav.contains(e.target)){e.stopPropagation();e.preventDefault()}},true);
})();
</script>
