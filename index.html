<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--tx:#0f2233;--mu:#5f7080;--pr:#0f766e;--on:#fff;--no:#e0533d;--am:#f0a81c;--bd:#d9e3e0;--gr:rgba(15,118,110,.07);--h1:#0f766e;--h2:#134e4a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1720;--card:#12232f;--tx:#e8f1f0;--mu:#93a8b3;--pr:#2dd4bf;--on:#06201e;--no:#ff7a63;--am:#fbbf24;--bd:#1f3644;--gr:rgba(255,255,255,.04);--h1:#0f3d3e;--h2:#0b2a30}}
:root[data-theme="dark"]{--bg:#0b1720;--card:#12232f;--tx:#e8f1f0;--mu:#93a8b3;--pr:#2dd4bf;--on:#06201e;--no:#ff7a63;--am:#fbbf24;--bd:#1f3644;--gr:rgba(255,255,255,.04);--h1:#0f3d3e;--h2:#0b2a30}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:24px 24px;color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.5}
header{position:relative;padding:calc(env(safe-area-inset-top,0px) + 18px) 72px 22px 20px;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:0 0 28px 28px;direction:ltr;text-align:left}
.hn{font-size:24px;font-weight:700;direction:ltr;text-align:start;letter-spacing:.2px}
.ht{font-size:14px;opacity:.85;margin-top:2px}
.gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px;padding:0;line-height:1}
.gear.on{background:rgba(255,255,255,.34)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;font-weight:600}
nav button i{font-style:normal;font-size:20px;line-height:1.2;width:56px;border-radius:14px;padding:3px 0;text-align:center}
nav button.on{color:var(--pr)}
nav button.on i{background:color-mix(in srgb,var(--pr) 18%,transparent)}
main{padding:16px 14px 120px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(15,34,51,.04)}
.card.st-p{border-inline-start:6px solid var(--pr)}
.card.st-a{border-inline-start:6px solid var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,input,textarea{font:inherit;padding:12px;border:1.5px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);flex:1;min-width:0;width:100%}
select:focus,input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--pr) 45%,transparent);outline-offset:1px}
.btn{display:flex;align-items:center;justify-content:center;min-height:46px;padding:8px 10px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;font-weight:600;flex:1 1 40%;text-align:center;text-decoration:none}
.btn.ok{background:var(--pr);color:var(--on);border-color:var(--pr)}
.btn.pay{background:var(--am);color:#1d1403;border-color:var(--am)}
.btn.no{background:var(--no);color:#fff;border-color:var(--no)}
.btn.pr{background:var(--pr);color:var(--on);border-color:var(--pr)}
.nm{font-weight:700;font-size:17px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px;font-weight:400}
.lbl{font-size:13px;font-weight:600;color:var(--mu);margin:12px 0 6px;display:block}
.stat{display:flex;gap:6px;margin-top:8px}
.stat div{flex:1;text-align:center;padding:10px 2px;border-radius:14px;background:var(--bg);font-size:12px;color:var(--mu)}
.stat b{display:block;font-size:20px;color:var(--tx)}
.owe{color:var(--no)}
.ph{display:flex;direction:ltr;gap:6px;align-items:center}.ph span{padding:12px;border:1.5px solid var(--bd);border-radius:14px;background:var(--bg);font-weight:700}
.dys{display:flex;flex-wrap:wrap;gap:6px}.dys label{flex:1 1 30%;display:flex;gap:6px;align-items:center;padding:10px;border:1.5px solid var(--bd);border-radius:14px;font-size:14px}.dys input{width:auto;flex:none;padding:0}

.tabs2{display:flex;gap:8px;margin:0 0 12px}.tabs2 .btn{flex:1 1 0}
.hwimg{width:100%;border-radius:14px;margin-top:8px;border:1px solid var(--bd)}
.code{font-weight:700;letter-spacing:3px;direction:ltr;display:inline-block;padding:2px 10px;border-radius:10px;background:var(--bg)}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;background:var(--bg);color:var(--mu);margin-inline-start:6px}
.pill.ok{background:color-mix(in srgb,var(--pr) 18%,transparent);color:var(--pr)}
.gate{display:flex;gap:8px;margin:0 0 12px}.gate .btn{flex:1 1 0}
</style>
</head>
<body>
<header id="hd"></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
var GR=["الرابع الابتدائي","الخامس الابتدائي","السادس الابتدائي","الأول الإعدادي","الثاني الإعدادي","الثالث الإعدادي"];
var GE=["Grade 4 (Primary)","Grade 5 (Primary)","Grade 6 (Primary)","Grade 7 (Prep 1)","Grade 8 (Prep 2)","Grade 9 (Prep 3)"];
var DAYS=["السبت","الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"];
var DE=["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday","Friday"];
var D={ar:{title:"متابعة الطلبة",grp:"مجموعة",gender:"النوع",boy:"ولد",girl:"بنت",both:"ولاد وبنات",boys:"ولاد",girls:"بنات",allgr:"كل الصفوف",att:"الحضور",stu:"الطلاب",sum:"الملخص",start:"ابدأ بإضافة الطلاب من تبويب «الطلاب».",allg:"كل المجموعات",date:"تاريخ الحصة",pr:"حضر",ab:"غاب",pd:"دفع",np:"لم يدفع",mp:"رسالة لولي الأمر",ms:"رسالة للطالب",nopp:"لا يوجد رقم ولي الأمر",none:"لا يوجد طلاب هنا.",add:"إضافة طالب",ed:"تعديل طالب",name:"الاسم",grade:"الصف",days:"أيام المجموعة",ph:"تليفون الطالب",pph:"تليفون ولي الأمر",save:"حفظ",cancel:"إلغاء",price:"سعر الحصة (جنيه)",edit:"تعديل",del:"حذف",conf:"اضغط تاني للتأكيد",month:"الشهر",tot:"إجمالي المتبقي على الطلبة:",cur:"جنيه",owed:"عليه",nost:"لا يوجد طلاب بعد.",set:"الإعدادات",lang:"اللغة",bt:"حفظ نسخة احتياطية",bd:"دوس «عرض البيانات»، وانسخ النص كله وابعته لنفسك على واتساب أو احفظه في الملاحظات.",show:"عرض البيانات",rt:"استرجاع نسخة",rd:"الصق النص المحفوظ هنا ودوس استرجاع. البيانات الحالية هتتبدل بيه.",rb:"استرجاع",bad:"النص غير صحيح، الصق النسخة كلها من جديد.",mh:function(n,d,a,p){return "السلام عليكم، بخصوص "+n+" حصة الرياضيات يوم "+d+": "+(a===1?"حضر":a===0?"غاب":"لم يُسجَّل حضوره")+(p===1?"، وتم دفع الحصة.":p===0?"، ولم يتم دفع الحصة بعد.":".")}},
en:{title:"Student Tracker",grp:"Group",gender:"Gender",boy:"Boy",girl:"Girl",both:"Boys & girls",boys:"Boys",girls:"Girls",allgr:"All grades",att:"Attendance",stu:"Students",sum:"Summary",start:"Start by adding students in the Students tab.",allg:"All groups",date:"Class date",pr:"Present",ab:"Absent",pd:"Paid",np:"Not paid",mp:"Message parent",ms:"Message student",nopp:"No parent number",none:"No students here.",add:"Add student",ed:"Edit student",name:"Name",grade:"Grade",days:"Group days",ph:"Student phone",pph:"Parent phone",save:"Save",cancel:"Cancel",price:"Price per class (EGP)",edit:"Edit",del:"Delete",conf:"Tap again to confirm",month:"Month",tot:"Total owed by students:",cur:"EGP",owed:"Owed",nost:"No students yet.",set:"Settings",lang:"Language",bt:"Save a backup",bd:"Tap Show data, copy all the text and send it to yourself on WhatsApp or save it in your notes.",show:"Show data",rt:"Restore a backup",rd:"Paste the saved text here and tap Restore. It will replace the current data.",rb:"Restore",bad:"Invalid text, paste the whole backup again.",mh:function(n,d,a,p){return "Hello, regarding "+n+" - Math class on "+d+": "+(a===1?"attended":a===0?"was absent":"attendance not recorded")+(p===1?", and the class fee was paid.":p===0?", and the class fee has not been paid yet.":".")}}};
Object.assign(D.ar,{an:"تحليل",days:"المجموعة",grp:"مجموعة",allgr:"كل الصفوف",allsx:"ولاد وبنات",boys:"ولاد",girls:"بنات",boy:"ولد",girl:"بنت",sex:"النوع",search:"ابحث بالاسم",det:"تفاصيل الطالب",ana:"تفصيل تحليلي",settle:"سدّد كل الحصص",howm:"عدد الحصص",setn:"سدّد",np:"لم يدفع",total:"الطلبة",unrec:"لم يُسجَّل",sm:function(n,a,b,u){return "السلام عليكم، الطالب "+n+": حضر "+a+" حصة، غاب "+b+" حصة، لم يدفع "+u+" حصة."}});
Object.assign(D.en,{an:"Analysis",days:"Group",grp:"Group",allgr:"All grades",allsx:"Boys & girls",boys:"Boys",girls:"Girls",boy:"Boy",girl:"Girl",sex:"Gender",search:"Search by name",det:"Student details",ana:"Analytical detail",settle:"Settle all classes",howm:"Classes",setn:"Settle",np:"Not paid",total:"Students",unrec:"Not recorded",sm:function(n,a,b,u){return "Hello, student "+n+": attended "+a+" classes, absent "+b+", not paid "+u+" classes."}});
var KEY="mathTeacherApp1",S={students:[],rec:{},price:50,lang:"ar"},tab="att",fg="",fgr="",fdate=new Date().toISOString().slice(0,10),fmon=fdate.slice(0,7),edit=null,pd=null,fgen="",sg="",sgr="",sgen="";
if(!S.lang)S.lang="ar";
function save(){if(window.cloudSave)window.cloudSave()}
function t(k){return D[S.lang][k]}
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function gn(g){var i=GR.indexOf(g);return S.lang=="en"&&i>=0?GE[i]:g}
function gd(g){g=String(g||"");return /^\d+$/.test(g)?t("grp")+" "+g:g}
function wa(p,txt){p=String(p||"").replace(/\D/g,"");if(!p)return "";if(p.charAt(0)=="0")p="20"+p.slice(1);return "https://wa.me/"+p+"?text="+encodeURIComponent(txt)}
function pn(v){v=String(v||"").replace(/\D/g,"");if(v.indexOf("20")==0&&v.length>10)v=v.slice(2);return v.replace(/^0+/,"")}
function ph(id){var v=pn(document.getElementById(id).value);return v?"+20"+v:""}
function rc(id,d){return S.rec[d+"|"+id]||{}}
function setRec(id,k,v){var key=fdate+"|"+id,o=S.rec[key]||{};o[k]=o[k]===v?undefined:v;S.rec[key]=o;save();draw()}
function go(x){tab=x;edit=null;pd=null;draw()}
function grades(){var g=[];S.students.forEach(function(s){if(g.indexOf(s.grade)<0)g.push(s.grade)});return g.sort(function(a,b){return GR.indexOf(a)-GR.indexOf(b)})}
function groups(g){var a=[];S.students.forEach(function(s){if(s.grade==g&&s.group&&a.indexOf(s.group)<0)a.push(s.group)});return a}
var sg="",sgr="",ss="",q="",dt=null;
function rank(s){return s.sex=="m"?0:s.sex=="f"?1:2}
function sortSex(L){return L.slice().sort(function(a,b){return rank(a)-rank(b)})}
function flt(){return S.students.filter(function(s){return(!sg||s.grade==sg)&&(!sgr||s.group==sgr)&&(!ss||s.sex==ss)&&(!q||s.name.indexOf(q)>=0)})}
function st(s,mon){var a=0,b=0,p=0,u=0;for(var k in S.rec){var x=k.split("|");if(x[1]!=s.id||(mon&&x[0].slice(0,7)!=mon))continue;var r=S.rec[k];if(r.a===1){a++;if(r.p===1)p++;else u++}else if(r.a===0)b++}return{a:a,b:b,p:p,u:u,o:u*S.price}}
function gOpts(v){return [1,2,3,4,5].map(function(n){return '<option value="'+n+'"'+(n==v?" selected":"")+'>'+t("grp")+" "+n+'</option>'}).join("")}
function sxSel(){return '<select onchange="ss=this.value;draw()"><option value="">'+t("allsx")+'</option><option value="m"'+(ss=="m"?" selected":"")+'>'+t("boys")+'</option><option value="f"'+(ss=="f"?" selected":"")+'>'+t("girls")+'</option></select>'}
function fbar(se){var h='<div class="card"><div class="row"><select onchange="sg=this.value;draw()"><option value="">'+t("allgr")+'</option>'+GR.map(function(g){return '<option value="'+g+'"'+(g==sg?" selected":"")+'>'+gn(g)+'</option>'}).join("")+'</select><select onchange="sgr=this.value;draw()"><option value="">'+t("allg")+'</option>'+gOpts(sgr)+'</select>'+sxSel()+'</div>';
if(se)h+='<input placeholder="'+t("search")+'" value="'+esc(q)+'" oninput="q=this.value;document.getElementById(\'sl\').innerHTML=listS()" style="margin-top:8px">';return h+'</div>'}
function att(){var gs=grades(),h='';
if(!gs.length)return '<div class="card">'+t("start")+'</div>';
if(gs.indexOf(fg)<0)fg=gs[0];
h+='<div class="card"><div class="row"><select onchange="fg=this.value;draw()">'+gs.map(function(g){return '<option value="'+g+'"'+(g==fg?" selected":"")+'>'+gn(g)+'</option>'}).join("")+'</select>';
h+='<select onchange="fgr=this.value;draw()"><option value="">'+t("allg")+'</option>'+gOpts(fgr)+'</select>'+sxSel()+'</div>';
h+='<span class="lbl">'+t("date")+'</span><input type="date" value="'+fdate+'" onchange="fdate=this.value||fdate;draw()"></div>';
var L=sortSex(S.students.filter(function(s){return s.grade==fg&&(!fgr||s.group==fgr)&&(!ss||s.sex==ss)}));
L.forEach(function(s){var r=rc(s.id,fdate),m=t("mh")(s.name,fdate,r.a,r.p),pw=wa(s.parentPhone,m),sw=wa(s.phone,m);
h+='<div class="card '+(r.a===1?"st-p":r.a===0?"st-a":"")+'"><div class="nm">'+(s.sex=="f"?"👧 ":s.sex=="m"?"👦 ":"")+esc(s.name)+' <span class="mu">'+esc(gd(s.group))+'</span></div><div class="row">'
+'<button class="btn '+(r.a===1?"ok":"")+'" onclick="setRec('+s.id+',\'a\',1)">'+t("pr")+'</button>'
+'<button class="btn '+(r.a===0?"no":"")+'" onclick="setRec('+s.id+',\'a\',0)">'+t("ab")+'</button>'
+'<button class="btn '+(r.p===1?"pay":"")+'" onclick="setRec('+s.id+',\'p\',1)">'+t("pd")+'</button></div><div class="row" style="margin-top:8px">'
+(pw?'<a class="btn pr" target="_blank" rel="noopener" href="'+pw+'">'+t("mp")+'</a>':'<span class="btn mu">'+t("nopp")+'</span>')
+(sw?'<a class="btn pr" target="_blank" rel="noopener" href="'+sw+'">'+t("ms")+'</a>':'')+'</div></div>'});
if(!L.length)h+='<div class="card mu">'+t("none")+'</div>';return h}
function detail(s,x){return '<div style="margin-top:10px;border-top:1px solid var(--bd);padding-top:10px;font-size:14px"><div>'+gn(s.grade)+', '+esc(gd(s.group))+'</div><div dir="ltr" style="text-align:start">'+esc(s.phone||"-")+' | '+esc(s.parentPhone||"-")+'</div><div class="stat"><div><b>'+x.a+'</b>'+t("pr")+'</div><div><b>'+x.b+'</b>'+t("ab")+'</div><div><b>'+x.p+'</b>'+t("pd")+'</div><div><b class="'+(x.u?"owe":"")+'">'+x.u+'</b>'+t("np")+'</div></div><div class="mu" style="margin-top:6px">'+t("owed")+': '+x.o+' '+t("cur")+'</div><div class="row" style="margin-top:8px"><button class="btn pay" onclick="settle('+s.id+',1e9)">'+t("settle")+'</button></div><div class="row" style="margin-top:8px"><input id="sn'+s.id+'" type="number" min="1" placeholder="'+t("howm")+'" style="flex:1 1 40%"><button class="btn" onclick="settle('+s.id+',+document.getElementById(\'sn'+s.id+'\').value||0)">'+t("setn")+'</button></div></div>'}
function settle(id,n){Object.keys(S.rec).filter(function(k){var r=S.rec[k];return k.split("|")[1]==id&&r.a===1&&r.p!==1}).sort().slice(0,n).forEach(function(k){S.rec[k].p=1});save();draw()}
function anaBtn(s,x){var pw=wa(s.parentPhone,t("sm")(s.name,x.a,x.b,x.u));return pw?'<a class="btn pr" target="_blank" rel="noopener" href="'+pw+'">'+t("ana")+'</a>':'<span class="btn mu">'+t("nopp")+'</span>'}
function scard(s){var open=dt==s.id,x=st(s);
var h='<div class="card"><div class="nm">'+(s.sex=="f"?"👧 ":s.sex=="m"?"👦 ":"")+esc(s.name)+' <span class="mu">'+esc(gd(s.group))+'</span></div><div class="row"><button class="btn" onclick="dt='+(open?"null":s.id)+';draw()">'+t("det")+'</button>'+anaBtn(s,x)
+'<button class="btn" onclick="edit=S.students.filter(function(x){return x.id=='+s.id+'})[0];draw();scrollTo(0,0)">'+t("edit")+'</button><button class="btn no" onclick="delS('+s.id+')">'+(pd==s.id?t("conf"):t("del"))+'</button></div>';
h+='<div class="mu" style="margin-top:8px">'+t("code")+': <span class="code">'+esc(s.code||"----")+'</span></div>';
var cw=wa(s.phone,t("codeMsg")(s.name,pn(s.phone)?("0"+pn(s.phone)):"",s.code||""));
h+='<div class="row" style="margin-top:8px">'+(cw?'<a class="btn pr" target="_blank" rel="noopener" href="'+cw+'">'+t("sendc")+'</a>':'')+'<button class="btn" onclick="newCode('+s.id+')">'+t("newc")+'</button></div>';
if(open)h+=detail(s,x);return h+'</div>'}
function genCode(){var used={};S.students.forEach(function(s){used[s.code]=1});var c;do{c=String(1000+Math.floor(Math.random()*9000))}while(used[c]);return c}
function newCode(id){S.students.forEach(function(s){if(s.id==id)s.code=genCode()});save();draw()}
function listS(){var L=sortSex(flt()),h='';GR.forEach(function(g){var M=L.filter(function(s){return s.grade==g});if(!M.length)return;h+='<div class="mu" style="margin:10px 4px 4px">'+gn(g)+' ('+M.length+')</div>';M.forEach(function(s){h+=scard(s)})});return L.length?h:'<div class="card mu">'+t("none")+'</div>'}
function stu(){var e=edit||{},h='<div class="card"><div class="nm">'+(e.id?t("ed"):t("add"))+'</div>'
+'<span class="lbl">'+t("name")+'</span><input id="f_n" value="'+esc(e.name)+'">'
+'<div class="dys" style="margin-top:8px"><label><input type="radio" name="sx" value="m"'+(e.sex!="f"?" checked":"")+'>'+t("boy")+'</label><label><input type="radio" name="sx" value="f"'+(e.sex=="f"?" checked":"")+'>'+t("girl")+'</label></div>'
+'<span class="lbl">'+t("grade")+'</span><select id="f_g">'+GR.map(function(g){return '<option value="'+g+'"'+(g==(e.grade||fg)?" selected":"")+'>'+gn(g)+'</option>'}).join("")+'</select>'
+'<span class="lbl">'+t("days")+'</span><select id="f_r">'+gOpts(e.group||1)+'</select>'
+'<span class="lbl">'+t("ph")+'</span><div class="ph"><span>+20</span><input id="f_p" type="tel" inputmode="numeric" placeholder="1012345678" value="'+esc(pn(e.phone))+'"></div>'
+'<span class="lbl">'+t("pph")+'</span><div class="ph"><span>+20</span><input id="f_pp" type="tel" inputmode="numeric" placeholder="1012345678" value="'+esc(pn(e.parentPhone))+'"></div>'
+'<div class="row" style="margin-top:12px"><button class="btn pr" onclick="addS()">'+t("save")+'</button>'+(e.id?'<button class="btn" onclick="edit=null;draw()">'+t("cancel")+'</button>':'')+'</div></div>'
+'<div class="card"><span class="lbl">'+t("price")+'</span><input type="number" value="'+S.price+'" onchange="S.price=+this.value||0;save()"></div>';

  login:(e,p)=>signInWithEmailAndPassword(auth,e,p),
  signup:(e,p)=>createUserWithEmailAndPassword(auth,e,p),
  logout:()=>signOut(auth),

  // ---- student side ----
  async studentLogin(phone,code){
    if(!auth.currentUser)await signInAnonymously(auth);
    const pid=phone+"_"+code;const ref=doc(db,"portal",pid);
    let snap;
    try{snap=await getDoc(ref)}catch(e){if(e.code=="permission-denied")return null;throw e}
    if(!snap.exists())return null;
    const d=snap.data();
    
    const hs=await getDocs(query(collection(db,"portal",pid,"hw")));
    const hw=[];hs.forEach(x=>hw.push(x.data()));
    hw.sort((a,b)=>String(b.id).localeCompare(String(a.id)));
    const sol={};
    const ss=await getDocs(collection(db,"portal",pid,"sol"));
    ss.forEach(x=>{sol[x.id]=x.data()});
    return {data:d,hw,sol};
  },
  async studentLogout(){try{await signOut(auth)}catch(e){}},
  async submitSol(phone,code,hwId,img){
    await setDoc(doc(db,"portal",phone+"_"+code,"sol",hwId),{img,at:Date.now()});
  }
};

// ---- teacher: load ----
async function loadFor(u){
  const main=await getDoc(doc(db,"teachers",u.uid));
  const snap=await getDocs(collection(db,"teachers",u.uid,"months"));
  const hs=await getDocs(collection(db,"teachers",u.uid,"hw"));
  const o={students:[],rec:{},price:50,lang:S.lang||"ar",hw:[]};
  lastMain="";lastM={};lastHw={};lastPortal={};
  if(main.exists()){const d=main.data();o.students=d.students||[];if(d.price!=null)o.price=d.price;if(d.lang)o.lang=d.lang;
    // make sure every student has a code
    o.students.forEach(s=>{if(!s.code)s.code=String(1000+Math.floor(Math.random()*9000))});
    lastMain=JSON.stringify({students:o.students,price:o.price,lang:o.lang})}
  snap.forEach(m=>{const r=(m.data().rec)||{};Object.assign(o.rec,r);lastM[m.id]=JSON.stringify(r)});
  hs.forEach(h=>{const d=h.data();o.hw.push(d);lastHw[d.id]=1});
  setData(o);
}

onAuthStateChanged(auth,async u=>{
  AU.err="";
  if(u&&!u.isAnonymous){
    isTeacher=true;
    AU.ready=false;AU.user=null;draw();
    try{await loadFor(u);AU.user=u;AU.sync="";ST.data=null;
      // refresh portal copy once after login (also covers codes just generated)
      lastMain="";cloudSave()}
    catch(e){AU.err=errMsg(e);AU.user=null;signOut(auth).catch(()=>{})}
  }else if(u&&u.isAnonymous){
    isTeacher=false;AU.user=null;
  }else{
    isTeacher=false;AU.user=null;AU.sync="";
    if(!ST.data)setData({students:[],rec:{},price:50,lang:S.lang,hw:[]});
  }
  AU.busy=false;AU.ready=true;draw();
});

window.cloudSave=function(){
  if(!auth.currentUser||auth.currentUser.isAnonymous)return;
  clearTimeout(timer);AU.sync="saving";syncUI();
  timer=setTimeout(flush,500);
};
window.cloudDelHw=async function(id){
  const u=auth.currentUser;if(!u||u.isAnonymous)return;
  try{await deleteDoc(doc(db,"teachers",u.uid,"hw",id));delete lastHw[id];
    for(const k of Object.keys(lastPortal)){if(k.indexOf("|")<0){try{await deleteDoc(doc(db,"portal",k,"hw",id))}catch(e){}}}
  }catch(e){console.error(e)}
};
window.cloudLoadSolv=async function(hwId){
  const u=auth.currentUser;if(!u||u.isAnonymous)return;
  const w=(S.hw||[]).find(x=>x.id==hwId);if(!w)return;
  const out={};
  try{
    for(const s of S.students.filter(x=>x.grade==w.grade)){
      const ph=pn(s.phone);if(!ph)continue;
      const d=await getDoc(doc(db,"portal",ph+"_"+String(s.code||""),"sol",hwId));
      if(d.exists())out[ph]=d.data();
    }
  }catch(e){console.error(e)}
  SOLV[hwId]=out;draw();
};

function stat(s){const x=st(s);return {a:x.a,b:x.b,p:x.p,u:x.u}}

async function flush(){
  const u=auth.currentUser;if(!u||u.isAnonymous)return;
  const data=JSON.parse(JSON.stringify(S));
  const main={students:data.students,price:data.price,lang:data.lang};
  const mj=JSON.stringify(main),ps=[];
  try{
    if(mj!==lastMain){lastMain=mj;ps.push(setDoc(doc(db,"teachers",u.uid),main))}
    const by={};
    for(const k in data.rec){const m=k.slice(0,7);(by[m]=by[m]||{})[k]=data.rec[k]}
    for(const m in by){const j=JSON.stringify(by[m]);if(lastM[m]!==j){lastM[m]=j;ps.push(setDoc(doc(db,"teachers",u.uid,"months",m),{rec:by[m]}))}}
    for(const m of Object.keys(lastM)){if(!by[m]){delete lastM[m];ps.push(deleteDoc(doc(db,"teachers",u.uid,"months",m)))}}
    // homework (teacher copy)
    for(const w of (data.hw||[])){if(!lastHw[w.id]){lastHw[w.id]=1;ps.push(setDoc(doc(db,"teachers",u.uid,"hw",w.id),w))}}
    // student portal copies
    const live={};
    for(const s of data.students){
      const ph=pn(s.phone);if(!ph)continue;
      const pid=ph+"_"+String(s.code||"");live[pid]=1;const pj={uid:u.uid,name:s.name,grade:s.grade,phone:ph,...stat(s)};
      const j=JSON.stringify(pj);
      if(lastPortal[pid]!==j){lastPortal[pid]=j;ps.push(setDoc(doc(db,"portal",pid),pj))}
      for(const w of (data.hw||[])){
        if(w.grade!==s.grade)continue;
        const key=pid+"|"+w.id;
        if(!lastPortal[key]){lastPortal[key]=1;ps.push(setDoc(doc(db,"portal",pid,"hw",w.id),{...w,uid:u.uid}))}
      }
    }
    for(const k of Object.keys(lastPortal)){
      if(k.indexOf("|")<0&&!live[k]){delete lastPortal[k];ps.push(deleteDoc(doc(db,"portal",k)))}
    }
    await Promise.all(ps);
    AU.sync="ok";
  }catch(e){
    lastMain="";lastM={};lastHw={};lastPortal={};AU.sync="err";console.error(e);
  }
  syncUI();
}
</script>
