<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تم إيقاف الموقع</title>
<style>
  :root {
    --bg: #f5f5f7;
    --text: #1d1d1f;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212;
      --text: #f5f5f7;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212;
    --text: #f5f5f7;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  p {
    color: var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    text-align: center;
    line-height: 1.8;
    max-width: 90%;
  }
</style>
</head>
<body>
  <div style="text-align:center;">
    <p>تم إيقاف الموقع<br>برجاء تحميل التطبيق</p>
    <a href="https://ahmedelhamal.github.io/D/" style="display:inline-block;margin-top:16px;color:var(--text);font-family:'Segoe UI', Tahoma, Arial, sans-serif;font-size:1rem;text-decoration:underline;">تحميل التطبيق</a>
  </div>
</body>
</html>
